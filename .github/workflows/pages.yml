# Publishes the demo to GitHub Pages: index.html (the page with the decoder built in; it fetches
# only the model picked) and the models, decoder.js and llm.txt alongside it. web/keypad.html,
# with every model built in, is the version that works offline.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          python3 web/build_page.py _site/index.html --lazy
          cp web/keypad.html _site/keypad.html
          cp web/decoder.js llm.txt model/onepress*.bin _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
